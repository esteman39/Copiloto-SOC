<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto-SOC En Construcción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.95rem;
            color: #8b949e;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            margin-bottom: 16px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #d29922;
            background-color: rgba(210, 153, 34, 0.1);
            border: 1px solid rgba(210, 153, 34, 0.2);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Mantenimiento</div>
        <h1>Copiloto-SOC En Construcción</h1>
        <p>Estamos trabajando en esta plataforma. Vuelve a intentarlo más tarde.</p>
    </div>
</body>
</html>
